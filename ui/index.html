<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DeepSeek Harness</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%;
        background: #10131a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        color: #e6e9f0;
      }
      body {
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        user-select: none;
      }
      .logo {
        width: 84px; height: 84px; border-radius: 20px;
        background: linear-gradient(135deg, #4d6bfe, #3451d2);
        display: flex; align-items: center; justify-content: center;
        font-size: 30px; font-weight: 800; color: #fff; letter-spacing: 1px;
        box-shadow: 0 8px 32px rgba(77, 107, 254, .35);
      }
      .spinner {
        width: 22px; height: 22px; border-radius: 50%;
        border: 3px solid rgba(255,255,255,.15);
        border-top-color: #7d95ff;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .hint { font-size: 13px; color: #8a92a6; }
    </style>
  </head>
  <body>
    <div class="logo">DSH</div>
    <div class="spinner"></div>
    <div class="hint">正在启动 DeepSeek Harness…</div>
  </body>
</html>
